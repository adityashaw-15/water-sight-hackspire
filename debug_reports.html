<!DOCTYPE html><html lang="en"><head>
<script>
const originalConsoleError = console.error;
console.error = function(...args) {
    var div = document.createElement('div');
    div.style.position = 'fixed';
    div.style.top = '0';
    div.style.left = '0';
    div.style.background = 'red';
    div.style.color = 'white';
    div.style.zIndex = '999999';
    div.style.padding = '20px';
    div.style.width = '100%';
    div.innerHTML = '<h2>React Error</h2><p>' + args.join(' ') + '</p>';
    document.body.appendChild(div);
    originalConsoleError.apply(console, args);
};
</script>

    div.style.background = 'red';

  <button id="bg-audio-toggle" class="audio-toggle" aria-label="Turn sound on" title="Turn sound on">🔇</button>
  <style>
    .audio-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(16, 44, 59, 0.85);
      border: 1px solid #235c52;
      color: #47cf83;
      font-size: 20px;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 100;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    .audio-toggle:hover {
      background: rgba(26, 71, 59, 0.95);
      transform: scale(1.05);
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('bg-audio-toggle');
      let isPlaying = false;
      let audioCtx = null;
      let masterGain = null;

      function initAudio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0;
        masterGain.connect(audioCtx.destination);

        // Rain / Stream
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufferSize; i++) {
          let white = Math.random() * 2 - 1;
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 3.5;
        }
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        noiseSource.loop = true;
        
        const lowpass = audioCtx.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.value = 800;
        noiseSource.connect(lowpass);
        lowpass.connect(masterGain);
        noiseSource.start();

        // Wind
        const windSource = audioCtx.createBufferSource();
        windSource.buffer = buffer;
        windSource.loop = true;
        const bandpass = audioCtx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.value = 300;
        bandpass.Q.value = 0.5;

        const lfo = audioCtx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.1;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 200;
        lfo.connect(lfoGain);
        lfoGain.connect(bandpass.frequency);
        lfo.start();

        const windGain = audioCtx.createGain();
        windGain.gain.value = 0.4;
        windSource.connect(bandpass);
        bandpass.connect(windGain);
        windGain.connect(masterGain);
        windSource.start();
      }

      function toggleAudio() {
        if (!audioCtx) initAudio();
        
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        isPlaying = !isPlaying;
        sessionStorage.setItem('watersight_audio_login', isPlaying ? 'true' : 'false');

        if (isPlaying) {
          masterGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 1.0);
          toggleBtn.innerHTML = '&#x1F50A;';
          toggleBtn.title = 'Mute sound';
          toggleBtn.setAttribute('aria-label', 'Mute sound');
        } else {
          masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
          toggleBtn.innerHTML = '&#x1F507;';
          toggleBtn.title = 'Turn sound on';
          toggleBtn.setAttribute('aria-label', 'Turn sound on');
        }
      }

      toggleBtn.addEventListener('click', toggleAudio);

      // Restore session state safely
      if (sessionStorage.getItem('watersight_audio_login') === 'true') {
        const startOnInteraction = () => {
          if (!isPlaying) toggleAudio();
          document.removeEventListener('click', startOnInteraction);
        };
        document.addEventListener('click', startOnInteraction);
      }
    });
  </script>
