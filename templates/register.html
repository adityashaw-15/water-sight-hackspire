{% extends "layout.html" %}
{% block title %}Create Account | WaterSight{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="font-weight: 800; font-size: 24px;">WATERSIGHT</h2>
    </div>
    
    <p class="subtitle">Create your account</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required />
      </div>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <div class="auth-divider">OR</div>

    {% if google_configured %}
    <a href="{{ url_for('auth_google') }}" class="btn-google">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" />
      Sign up with Google
    </a>
    {% else %}
    <div style="text-align: center; padding: 12px; background: #f9f9f9; border: 1px dashed #d1dbd6; border-radius: 8px; color: #687d72; font-size: 13px;">
      Google Sign-In is not configured.
    </div>
    {% endif %}

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
