<!doctype html>
<html lang="en">
  <head><script>window.onerror = function(m, s, l, c, e) { fetch("http://localhost:5001/log_error", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({message: m, source: s, lineno: l, colno: c, error: e ? e.stack : ""})}); };</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102c3b" />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='watersight-logo.png') }}" />
    <title>WaterSight | Dashboard</title>
    <link rel="stylesheet" crossorigin href="{{ url_for('static', filename='css/main.css') }}?v=77">
    <script type="module" crossorigin src="{{ url_for('static', filename='js/main.js') }}?v=77"></script>
  </head>
  <body>
    <!-- Flask injected user info for React to consume if needed -->
    <script>
      {% if current_user.is_authenticated %}
      window.CURRENT_USER = {
        name: "{{ current_user.full_name or current_user.username }}",
        email: "{{ current_user.email }}",
        avatar: "{{ current_user.profile_picture or '' }}"
      };
      {% else %}
      window.CURRENT_USER = null;
      {% endif %}
    </script>
    <div id="root"></div>
  </body>
</html>
